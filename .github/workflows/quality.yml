name: Portfolio quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Lint, build and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run check

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Install matching ChromeDriver
        run: npx --yes browser-driver-manager install chrome

      - name: Accessibility smoke test
        run: |
          DRIVER_PATH="$(find "$HOME/.browser-driver-manager" "$HOME/.cache" "$HOME/.npm" "$RUNNER_TEMP" -type f -name chromedriver -perm -111 2>/dev/null | head -n 1)"
          test -n "$DRIVER_PATH"
          npx --yes @axe-core/cli http://127.0.0.1:4173 --chromedriver-path "$DRIVER_PATH" --exit
